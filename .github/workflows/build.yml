# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Loopback multicast and unprivileged PTP ports (tests never use a real network)
        run: |
          sudo ip link set lo multicast on
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      # the codec source tarballs (cmake/codecs.cmake) from the cache, so a download outage at
      # sourceforge or xiph.org does not break the build; saved right after the configure step
      # (also when a later step fails)
      - name: Restore the codec source tarballs
        id: codecs
        uses: actions/cache/restore@v4
        with:
          path: codec-cache
          key: codecs-${{ runner.os }}-${{ hashFiles('cmake/codecs.cmake') }}
      # the Stereo Tool SDK zip (cmake/stereotool.cmake, about 360 MB) in a cache entry of its own.
      # The download URL carries no version: once Thimeo publishes a newer Stereo Tool under the
      # same name, a fresh download fails the pinned SHA-256 and the configure says what to do, while
      # a cached copy keeps the builds going (GitHub drops an entry not used for 7 days: a run a
      # week keeps it). The restore key without the hash keeps an earlier entry usable after an edit
      # of stereotool.cmake that keeps the pin (the zip is checked against the SHA-256 anyway).
      - name: Restore the Stereo Tool SDK
        id: stsdk
        uses: actions/cache/restore@v4
        with:
          path: stereotool-cache
          key: stereotool-sdk-${{ runner.os }}-${{ hashFiles('cmake/stereotool.cmake') }}
          restore-keys: stereotool-sdk-${{ runner.os }}-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBAM_WITH_CODECS=ON -DBAM_CODEC_CACHE=codec-cache -DBAM_STEREOTOOL_CACHE=stereotool-cache
      - name: Save the codec source tarballs
        if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codec-cache
          key: codecs-${{ runner.os }}-${{ hashFiles('cmake/codecs.cmake') }}
      - name: Save the Stereo Tool SDK
        if: steps.stsdk.outputs.cache-hit != 'true' && hashFiles('stereotool-cache/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: stereotool-cache
          key: stereotool-sdk-${{ runner.os }}-${{ hashFiles('cmake/stereotool.cmake') }}
      - name: Build
        run: cmake --build build
      - name: Unit and integration tests
        # bam_tests directly, with every test case printed as it starts and ends (a hang names its
        # test); ctest for the rest (the panel logic under node)
        timeout-minutes: 25
        env:
          BAM_TEST_PROGRESS: 1
        # from build/: the tests write their temporary files to the working directory
        working-directory: build
        run: |
          ./bam_tests
          ctest --output-on-failure -E '^bam_tests$'
      - name: Loopback test (32 pairs, PTP simulator, 20 s)
        run: |
          mkdir run && cd run
          ../build/ptp-sim --iface 127.0.0.1 > ptp.log 2>&1 &
          # slave only: follow ptp-sim (which has the lowest priority and would otherwise lose the election)
          printf '{"version":2,"interface_ip":"127.0.0.1","ptp_role":"slave"}' > bounceaes-config.json
          ../build/BounceAESService --console > service.log 2>&1 &
          sleep 2
          curl -sf -H 'Content-Type: application/json' -d '{"password":"ci-haslo-123"}' http://127.0.0.1:8067/api/setup
          ../build/bounceaes-test --configure-loopback --devices 32 --password ci-haslo-123 --interface 127.0.0.1
          sleep 3
          ../build/bounceaes-test --loopback --seconds 20 --devices 32
      - name: Bounce Encoder starts and finds its codecs next to the executable (127.0.0.1 only)
        run: |
          mkdir run-encoder && cd run-encoder
          printf '{"version":1,"interface_ip":"127.0.0.1","http_bind":"127.0.0.1","http_port":8070,"stations":[]}' > cfg.json
          # loopback only: refuse to start with anything else in the configuration
          jq -e '.interface_ip == "127.0.0.1" and .http_bind == "127.0.0.1" and .stations == []' cfg.json
          ../build/BounceEncoder --version
          ../build/BounceEncoder --console --config cfg.json > encoder.log 2>&1 &
          enc=$!
          sleep 2
          curl -sf -c jar -H 'Content-Type: application/json' -d '{"password":"ci-haslo-123"}' http://127.0.0.1:8070/api/setup
          curl -sf -b jar http://127.0.0.1:8070/api/codecs > codecs.json
          jq -r '.codecs[] | "\(.id) \(.available) \(.library)"' codecs.json
          jq -e 'all(.codecs[]; .available)' codecs.json
          curl -sf -b jar http://127.0.0.1:8070/api/status > status.json
          jq -e '.interface_ip == "127.0.0.1"' status.json
          # no Stereo Tool library on Linux builds: reported as missing, never a failure of the service
          curl -sf -b jar http://127.0.0.1:8070/api/stereotool > stereotool.json
          jq -r '.library | "Stereo Tool: available \(.available), \(.error)"' stereotool.json
          jq -e '.library.checked and (.library.available | not) and (.library.error | contains("brak biblioteki Stereo Tool"))' stereotool.json
          test -f public/panel.json
          kill $enc
      - name: Service log
        if: always()
        run: |
          cat run/service.log || true
          cat run-encoder/encoder.log || true

  # Bounce Encoder's Stereo Tool binding, processing, engine, API and configuration against the
  # fake library (a .dylib under the real library's name), and the SDK check with _ST_MAC. Only
  # those tests: the BounceAES Master ones need Linux or Windows networking.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the codec source tarballs
        id: codecs
        uses: actions/cache/restore@v4
        with:
          path: codec-cache
          key: codecs-${{ runner.os }}-${{ hashFiles('cmake/codecs.cmake') }}
      # the Stereo Tool SDK zip in a cache entry of its own (see the linux job)
      - name: Restore the Stereo Tool SDK
        id: stsdk
        uses: actions/cache/restore@v4
        with:
          path: stereotool-cache
          key: stereotool-sdk-${{ runner.os }}-${{ hashFiles('cmake/stereotool.cmake') }}
          restore-keys: stereotool-sdk-${{ runner.os }}-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBAM_WITH_CODECS=ON -DBAM_CODEC_CACHE=codec-cache -DBAM_STEREOTOOL_CACHE=stereotool-cache
      - name: Save the codec source tarballs
        if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codec-cache
          key: codecs-${{ runner.os }}-${{ hashFiles('cmake/codecs.cmake') }}
      - name: Save the Stereo Tool SDK
        if: steps.stsdk.outputs.cache-hit != 'true' && hashFiles('stereotool-cache/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: stereotool-cache
          key: stereotool-sdk-${{ runner.os }}-${{ hashFiles('cmake/stereotool.cmake') }}
      - name: Build
        run: cmake --build build --parallel 4 --target bam_tests
      - name: Stereo Tool, processing and encoder tests (fake library)
        timeout-minutes: 20
        env:
          BAM_TEST_PROGRESS: 1
        working-directory: build
        run: ./bam_tests '--test-case=stereotool:*,processing:*,encoder engine:*,encoder HTTP:*,encoder config:*'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore the codec source tarballs
        id: codecs
        uses: actions/cache/restore@v4
        with:
          path: codec-cache
          key: codecs-${{ runner.os }}-${{ hashFiles('cmake/codecs.cmake') }}
      # the Stereo Tool SDK zip in a cache entry of its own (see the linux job)
      - name: Restore the Stereo Tool SDK
        id: stsdk
        uses: actions/cache/restore@v4
        with:
          path: stereotool-cache
          key: stereotool-sdk-${{ runner.os }}-${{ hashFiles('cmake/stereotool.cmake') }}
          restore-keys: stereotool-sdk-${{ runner.os }}-
      - name: Configure (MSVC x64, newest Visual Studio on the runner)
        run: cmake -S . -B build -A x64 -DBAM_WITH_CODECS=ON -DBAM_CODEC_CACHE=codec-cache -DBAM_STEREOTOOL_CACHE=stereotool-cache
      - name: Save the codec source tarballs
        if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codec-cache
          key: codecs-${{ runner.os }}-${{ hashFiles('cmake/codecs.cmake') }}
      - name: Save the Stereo Tool SDK
        if: steps.stsdk.outputs.cache-hit != 'true' && hashFiles('stereotool-cache/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: stereotool-cache
          key: stereotool-sdk-${{ runner.os }}-${{ hashFiles('cmake/stereotool.cmake') }}
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        # bam_tests directly, with every test case printed as it starts and ends (a hang names its
        # test); ctest for the rest (the panel logic under node)
        timeout-minutes: 25
        env:
          BAM_TEST_PROGRESS: 1
        # from build\: the tests write their temporary files to the working directory
        working-directory: build
        run: |
          & Release\bam_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest -C Release --output-on-failure -E '^bam_tests$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stereo Tool - the real DLL without a licence key (load, preset, process, timing, network)
        # in a run of its own (the library stays loaded in the process): version 11.07, Create3
        # without a key, a preset saved by the DLL under the preset store's temporary name and
        # loaded again, 20 s of audio with the licence check every 250 ms, Delete; prints the times
        # of Create3, Process(480 frames), CheckLicenseValid, SavePreset, LoadPreset and Delete.
        # Network: a preset made with UECP, stream output, MicroMPX, Poll STS and the scheduler on
        # and the web interface without a password is loaded through the binding: every network
        # switch is off (GetStsValue), the web interface asks for the instance's password, a preset
        # saved through the binding does not hold it, and with the web interface serving, the
        # process's TCP and UDP endpoints (GetExtendedTcpTable/GetExtendedUdpTable, IPv4 and IPv6)
        # are on 127.0.0.1 only, listeners and connections
        timeout-minutes: 10
        working-directory: build
        run: |
          $dll = (Resolve-Path Release\libStereoTool_64.dll).Path
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash
          if ($hash -ne '48CBDC06F44A203F7FA2895B3EC79FC63557D61DCD687563C6A17388D6308C4E') { throw "libStereoTool_64.dll has SHA-256 $hash" }
          $env:BAM_TEST_REAL_STEREOTOOL = (Resolve-Path Release).Path
          & Release\bam_tests.exe '--test-case=stereotool: the real library*' | Tee-Object -FilePath real-stereotool.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Quiet -SimpleMatch 'real Stereo Tool timing: Process(480)' real-stereotool.log)) { throw 'the real Stereo Tool test did not run' }
          if (-not (Select-String -Quiet -SimpleMatch 'real Stereo Tool network:' real-stereotool.log)) { throw 'the real Stereo Tool network test did not run' }
      - name: Configure and build 32-bit (ASIO driver for 32-bit hosts such as 32-bit mAirList)
        run: |
          cmake -S . -B build32 -A Win32 -DBAM_WITH_CODECS=OFF
          cmake --build build32 --config Release
      - name: Tests (32-bit)
        timeout-minutes: 25
        env:
          BAM_TEST_PROGRESS: 1
        working-directory: build32
        run: |
          & Release\bam_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest -C Release --output-on-failure -E '^bam_tests$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ASIO driver as 64-bit and 32-bit hosts see it, 32-bit client with the 64-bit service (no network)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = (Resolve-Path build\Release).Path
          $b32 = (Resolve-Path build32\Release).Path
          New-Item -ItemType Directory asio-check | Out-Null
          Set-Location asio-check
          '{"version":2,"interface_ip":"127.0.0.1","http_bind":"127.0.0.1","ptp_role":"slave"}' | Set-Content -Encoding ascii cfg.json
          $svc = Start-Process -PassThru -NoNewWindow -RedirectStandardOutput service.log -RedirectStandardError service.err "$b64\BounceAESService.exe" -ArgumentList '--console', '--config', 'cfg.json'
          try {
            Start-Sleep 3
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"password":"ci-haslo-123"}' http://127.0.0.1:8067/api/setup | Out-Null
            Start-Process -Wait "$env:WINDIR\System32\regsvr32.exe" -ArgumentList '/s', "`"$b64\BounceAESAsio.dll`""
            Start-Process -Wait "$env:WINDIR\SysWOW64\regsvr32.exe" -ArgumentList '/s', "`"$b32\BounceAESAsio.dll`""
            & "$b64\asio-probe.exe"; if ($LASTEXITCODE -ne 0) { throw '64-bit host does not see the driver' }
            & "$b32\asio-probe.exe"; if ($LASTEXITCODE -ne 0) { throw '32-bit host does not see the driver' }
            & "$b32\bounceaes-test.exe" --configure-loopback --asio-only --devices 32 --password ci-haslo-123 --interface 127.0.0.1
            if ($LASTEXITCODE -ne 0) { throw 'configure' }
            Start-Sleep 1
            & "$b32\bounceaes-test.exe" --loopback --seconds 10 --devices 32
            if ($LASTEXITCODE -ne 0) { throw '32-bit ASIO client with the 64-bit service' }
          } finally {
            Stop-Process $svc -ErrorAction SilentlyContinue
            Start-Process -Wait "$env:WINDIR\System32\regsvr32.exe" -ArgumentList '/s', '/u', "`"$b64\BounceAESAsio.dll`""
            Start-Process -Wait "$env:WINDIR\SysWOW64\regsvr32.exe" -ArgumentList '/s', '/u', "`"$b32\BounceAESAsio.dll`""
            Get-Content service.log -Tail 30 -ErrorAction SilentlyContinue
          }
      - name: Bounce Encoder starts and loads its codecs from its own folder (127.0.0.1 only, no network)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = (Resolve-Path build\Release).Path
          & "$b64\BounceEncoder.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'BounceEncoder --version' }
          New-Item -ItemType Directory encoder-check | Out-Null
          Set-Location encoder-check
          '{"version":1,"interface_ip":"127.0.0.1","http_bind":"127.0.0.1","http_port":8070,"stations":[]}' | Set-Content -Encoding ascii cfg.json
          # loopback only: refuse to start with anything else in the configuration
          $cfg = Get-Content -Raw cfg.json | ConvertFrom-Json
          if ($cfg.interface_ip -ne '127.0.0.1' -or $cfg.http_bind -ne '127.0.0.1' -or @($cfg.stations).Count -ne 0) { throw 'cfg.json is not loopback-only' }
          $enc = Start-Process -PassThru -NoNewWindow -RedirectStandardOutput encoder.out -RedirectStandardError encoder.log "$b64\BounceEncoder.exe" -ArgumentList '--console', '--config', 'cfg.json'
          try {
            Start-Sleep 3
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"password":"ci-haslo-123"}' -SessionVariable web http://127.0.0.1:8070/api/setup | Out-Null
            $codecs = (Invoke-RestMethod -WebSession $web http://127.0.0.1:8070/api/codecs).codecs
            $codecs | Format-Table id, available, library -AutoSize | Out-String | Write-Host
            $missing = @($codecs | Where-Object { -not $_.available })
            if ($missing.Count -gt 0) { throw "codecs not available: $($missing.id -join ', ')" }
            foreach ($c in $codecs | Where-Object { $_.id -ne 'flac' }) {
              if (-not $c.library.StartsWith($b64, [System.StringComparison]::OrdinalIgnoreCase)) { throw "codec $($c.id) loaded from $($c.library)" }
            }
            if (-not (Test-Path public\panel.json)) { throw 'public\panel.json was not written' }
            $status = Invoke-RestMethod -WebSession $web http://127.0.0.1:8070/api/status
            if ($status.interface_ip -ne '127.0.0.1') { throw "the service runs on $($status.interface_ip), not 127.0.0.1" }
            # Stereo Tool from the program folder (loaded here, no instance: no station has processing)
            $lib = (Invoke-RestMethod -WebSession $web http://127.0.0.1:8070/api/stereotool).library
            $lib | Format-List available, version_text, path, error | Out-String | Write-Host
            if (-not $lib.available -or $lib.version -ne 11070) { throw "Stereo Tool not available: $($lib.error)" }
            if (-not $lib.path.StartsWith($b64, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Stereo Tool loaded from $($lib.path)" }
          } finally {
            Stop-Process $enc -ErrorAction SilentlyContinue
            Get-Content encoder.log -Tail 30 -ErrorAction SilentlyContinue
          }
      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $payload = Join-Path $PWD 'build\Release'
          $payload32 = Join-Path $PWD 'build32\Release'
          Set-Location installer\nsis
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DPAYLOAD=$payload" "/DPAYLOAD32=$payload32" BounceAES-setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Bounce Encoder installer
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'build\Release'
          Set-Location installer\nsis
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DPAYLOAD=$payload" BounceEncoder-setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # with Stereo Tool (117 MB) inside: about 30 MB more than 1.0
          "BounceEncoder-setup.exe: {0:N1} MB" -f ((Get-Item BounceEncoder-setup.exe).Length / 1MB) | Write-Host
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Release\BounceAESService.exe, build\Release\BounceAESAsio.dll, build\Release\BounceAESTray.exe, build\Release\BounceAESAudioBridge.exe, build\Release\bounceaes-test.exe, build\Release\ptp-sim.exe, build\Release\asio-probe.exe dist\
          Copy-Item build32\Release\BounceAESAsio.dll dist\BounceAESAsio32.dll
          Copy-Item build32\Release\asio-probe.exe dist\asio-probe32.exe
          Copy-Item installer\install.ps1, installer\uninstall.ps1, LICENSE dist\
      - name: Collect Bounce Encoder binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-encoder | Out-Null
          Copy-Item build\Release\BounceEncoder.exe, build\Release\BounceEncoderTray.exe, build\Release\libmp3lame.dll, build\Release\libfdk-aac-2.dll, build\Release\libStereoTool_64.dll dist-encoder\
          Copy-Item -Recurse build\Release\encoder-licenses dist-encoder\licencje
          if (-not (Test-Path dist-encoder\licencje\StereoTool-NOTICE.txt)) { throw 'the Stereo Tool notice is missing' }
          # under the installer's names, which the docs and the Stereo Tool notice use
          Copy-Item LICENSE dist-encoder\LICENSE.txt
          Copy-Item LICENSING.md dist-encoder\LICENCJE.md
          Copy-Item docs\ENCODER-INSTALL.md dist-encoder\INSTRUKCJA.md
          Copy-Item docs\ENCODER-TESTING.md dist-encoder\TESTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: BounceAES-Master-setup
          path: installer/nsis/BounceAES-Master-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BounceAES-Master-binaries
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: BounceEncoder-setup
          path: installer/nsis/BounceEncoder-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BounceEncoder-binaries
          path: dist-encoder
