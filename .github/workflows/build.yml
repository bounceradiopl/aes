# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Loopback multicast and unprivileged PTP ports (tests never use a real network)
        run: |
          sudo ip link set lo multicast on
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Loopback test (32 devices, PTP simulator, 20 s)
        run: |
          mkdir run && cd run
          ../build/ptp-sim --iface 127.0.0.1 > ptp.log 2>&1 &
          printf '{"interface_ip":"127.0.0.1"}' > bounceaes-config.json
          ../build/BounceAESService --console > service.log 2>&1 &
          sleep 2
          curl -sf -H 'Content-Type: application/json' -d '{"password":"ci-haslo-123"}' http://127.0.0.1:8067/api/setup
          ../build/bounceaes-test --configure-loopback --devices 32 --password ci-haslo-123 --interface 127.0.0.1
          sleep 3
          ../build/bounceaes-test --loopback --seconds 20 --devices 32
      - name: Service log
        if: always()
        run: cat run/service.log || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64, newest Visual Studio on the runner)
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 /DPAYLOAD=..\..\build\Release installer\nsis\BounceAES-setup.nsi
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Release\BounceAESService.exe, build\Release\BounceAESAsio.dll, build\Release\BounceAESTray.exe, build\Release\bounceaes-test.exe, build\Release\ptp-sim.exe dist\
          Copy-Item installer\install.ps1, installer\uninstall.ps1, LICENSE dist\
      - uses: actions/upload-artifact@v4
        with:
          name: BounceAES-Master-setup
          path: installer/nsis/BounceAES-Master-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BounceAES-Master-binaries
          path: dist
